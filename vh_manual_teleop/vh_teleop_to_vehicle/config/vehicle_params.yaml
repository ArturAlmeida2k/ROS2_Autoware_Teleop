# Parâmetros dos nós do lado do veículo. Os valores marcados com (*) são estimativas
# e têm de ser confirmados no carro antes do primeiro teste.

control:
  ros__parameters:
    speed_kp: 0.5
    brake_kp_max: 5.0
    max_accel: 1.0
    max_decel: 5.0                # o vehicle_interface limita depois a -2 m/s2

vehicle_interface:
  ros__parameters:
    steering_ratio: 14.0          # (*) graus de volante por grau de roda
    steering_sign: 1.0            # (*) -1.0 se o volante do carro rodar ao contrário
    max_steering_wheel_deg: 480.0
    steering_kp: 0.02             # (*) Nm por grau de erro (100 graus de erro = 2 Nm)
    steering_kd: 0.002            # (*) Nm por grau/s
    max_steering_torque: 2.0      # limite da interface (pode ir a 3 Nm, por testar)
    max_accel: 1.0                # limite da interface: +1 m/s2
    max_decel: 2.0                # limite da interface: -2 m/s2
    stop_decel: 2.0
    command_timeout: 0.5          # s sem comandos em REMOTE -> trava
    control_rate: 100.0           # Hz
